<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="response.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="response-container drag">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <div class="header no-drag">
      <div class="left-section">
        <img src="../../../icon_white.png" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTEiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+'" />
        <span class="title">Meeting Notes</span>
      </div>
      <div class="right-section">
        <button id="close-btn" class="icon-btn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </button>
      </div>
    </div>

    <!-- ── Notes list ─────────────────────────────────────────────────────── -->
    <div class="notes-panel no-drag" id="notes-panel">
      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Notes
        <span class="count-badge" id="notes-count-badge">0</span>
      </div>
      <div id="notes-list" class="notes-list">
        <div class="empty-msg">No notes uploaded yet. Upload .txt files from the main window.</div>
      </div>
    </div>

    </div>
  </div>
  <script src="response_renderer.js"></script>
</body>
</html>
