<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="bar.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bar-container">
    <div class="content drag">
      <img src="../../../icon_white.png" class="logo no-drag" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTEiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+'" />

      <button id="listen-btn" class="btn blue-btn no-drag">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="5" y="9" width="3" height="6" rx="1"/><rect x="10.5" y="5" width="3" height="14" rx="1"/><rect x="16" y="9" width="3" height="6" rx="1"/></svg>
        Listen
      </button>

      <button id="ask-btn" class="btn transparent-btn no-drag">
        <span class="text-icon">T</span>
        Ask question
      </button>

      <button id="hide-btn" class="icon-btn no-drag">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      
      <div class="divider"></div>
      
      <div class="drag-handle drag">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
      </div>
    </div>
  </div>
  <script src="bar_renderer.js"></script>
</body>
</html>
