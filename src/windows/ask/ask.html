<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="ask.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ask-container">
    <div class="content drag">
      <input type="text" id="question-input" class="no-drag" placeholder="Ask about your screen" autofocus />

      </button>
    </div>
  </div>
  <script src="ask_renderer.js"></script>
</body>
</html>
