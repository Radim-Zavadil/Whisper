<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cluely — Meeting Notes Assistant</title>
  <link rel="stylesheet" href="index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="titlebar">
    <div class="drag-region"></div>
    <div class="window-controls">
      <button id="minimize-btn" class="control-btn" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5" width="10" height="2" fill="currentColor"/></svg>
      </button>
      <button id="maximize-btn" class="control-btn" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button id="close-btn" class="control-btn close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1L11 11M1 11L11 1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <header class="app-header">
    <div class="header-left">
      <img src="../../../icon_black.png" alt="Logo" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTEiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzIyMiIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+'" />
      <div class="nav-arrows">
        <button class="arrow-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="arrow-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    
    <div class="search-container">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search notes..." class="search-input" />
      <span class="search-shortcut">Ctrl  K</span>
    </div>

    <div class="header-right">
      <button id="upload-notes-btn" class="upload-btn" title="Upload .txt notes file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Notes
      </button>
      <button id="start-btn" class="start-btn">Start Cluely</button>
    </div>
  </header>

  <main class="content">
    <section class="greeting-section">
      <div class="greeting-content">
        <h1 id="greeting-text">Good afternoon.</h1>
        <p>Upload your meeting notes (.txt) and start a session to get AI-powered ideas during your Zoom calls.</p>
      </div>
      <div class="notes-stats" id="notes-stats">
        <div class="stat-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span id="notes-count">0 notes</span>
        </div>
      </div>
    </section>

    <section class="activity-section">
      <div class="activity-header">
        <h2>YOUR MEETING NOTES</h2>
        <div class="view-toggles">
          <button class="active" id="view-list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button id="view-grid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
        </div>
      </div>

      <div class="activity-list" id="notes-list">
        <!-- Dynamic notes will be injected here -->
      </div>
    </section>
  </main>

  <!-- Note Detail Modal -->
  <div id="note-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-container">
          <img src="../../../icon_black.png" class="modal-logo" />
          <span class="modal-title" id="modal-note-title">Note Details</span>
        </div>
        <button id="close-modal-btn" class="close-btn-modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="note-detail-content" id="modal-note-content"></div>
    </div>
  </div>

  <!-- Upload success toast -->
  <div id="toast" class="toast"></div>

  <script src="renderer.js"></script>
</body>
</html>
