<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cluely</title>
  <link rel="stylesheet" href="index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="titlebar">
    <div class="drag-region"></div>
    <div class="window-controls">
      <button id="minimize-btn" class="control-btn" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5" width="10" height="2" fill="currentColor"/></svg>
      </button>
      <button id="maximize-btn" class="control-btn" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button id="close-btn" class="control-btn close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1L11 11M1 11L11 1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <header class="app-header">
    <div class="header-left">
      <img src="../../../icon_black.png" alt="Logo" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTEiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzIyMiIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+'" />
      <div class="nav-arrows">
        <button class="arrow-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="arrow-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search or ask anything..." class="search-input" />
      <span class="search-shortcut">Ctrl  K</span>
    </div>

    <div class="header-right">
      <button class="start-btn">Start Cluely</button>
    </div>
  </header>

  <main class="content">
    <section class="greeting-section">
      <div class="greeting-content">
        <h1>Good afternoon, Radim.</h1>
        <p>Link or set your <a href="#">calendars</a> to see upcoming meetings.</p>
      </div>
      <div class="calendar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
    </section>

    <section class="activity-section">
      <div class="activity-header">
        <h2>YOUR ACTIVITY</h2>
        <div class="view-toggles">
          <button class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
        </div>
      </div>

      <div class="activity-list" id="activity-list">
        <!-- Dynamic content will be injected here -->
      </div>
    </section>
  </main>

  <div id="history-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-container">
          <img src="../../../icon_black.png" class="modal-logo" />
          <span class="modal-title">Activity Details</span>
        </div>
        <button id="close-modal-btn" class="close-btn-modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="chat-container">
        <div class="chat-message user-msg">
          <div class="bubble" id="modal-question"></div>
        </div>
        <div class="chat-message ai-msg">
          <div class="bubble" id="modal-answer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
